name: Research feed safety

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "docs/research-distribution/**"
      - "research/distribution-core/**"
      - ".github/workflows/research-feed-safety.yml"
  push:
    branches: [main]
    paths:
      - "docs/research-distribution/**"
      - "research/distribution-core/**"
      - ".github/workflows/research-feed-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: research-feed-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deterministic-contract:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: Lint and deterministic contract
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Lint Research Feed V1 implementation and tests
        shell: bash
        run: |
          set -euo pipefail
          php -l research/distribution-core/includes/class-bitmomo-research-feed-v1.php
          php -l research/distribution-core/includes/class-bitmomo-research-feed-provider-v1.php
          php -l research/distribution-core/tests/test-bitmomo-research-feed-v1.php
          php -l research/distribution-core/tests/test-bitmomo-research-feed-provider-v1.php

      - name: Run Research Feed V1 deterministic suites
        shell: bash
        run: |
          set -euo pipefail
          php research/distribution-core/tests/test-bitmomo-research-feed-v1.php
          php research/distribution-core/tests/test-bitmomo-research-feed-provider-v1.php

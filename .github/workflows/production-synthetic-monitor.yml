name: Production synthetic monitor [HOSTED RUNNERS LOCKED]

# Zero-cost mode: no automatic schedule/PR/push trigger is allowed.
# Use locally instead:
#   bash scripts/bitmomo-check.sh smoke https://bitmomo.id
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-actions-locked:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Hosted GitHub Actions are locked. Run the local smoke command instead.'

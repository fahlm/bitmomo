name: Production synthetic monitor

on:
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/production-synthetic-monitor.yml"

permissions:
  contents: read

concurrency:
  group: production-synthetic-monitor
  cancel-in-progress: true

jobs:
  production-health:
    name: Public production health
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check launch-critical public surfaces
        shell: bash
        run: |
          set -euo pipefail

          has_robots_noindex() {
            python3 - "$1" <<'PY'
          import re
          import sys

          with open(sys.argv[1], encoding="utf-8", errors="ignore") as handle:
              html = handle.read()

          for tag in re.findall(r"<meta\b[^>]*>", html, flags=re.IGNORECASE):
              is_robots = re.search(r"\bname\s*=\s*['\"]robots['\"]", tag, flags=re.IGNORECASE)
              is_noindex = re.search(r"\bcontent\s*=\s*['\"][^'\"]*\bnoindex\b", tag, flags=re.IGNORECASE)
              if is_robots and is_noindex:
                  raise SystemExit(0)

          raise SystemExit(1)
          PY
          }

          check_page() {
            local url="$1"
            local marker="$2"
            local body
            local code
            body="$(mktemp)"
            code="$(curl --location --silent --show-error --max-time 20 --output "${body}" --write-out '%{http_code}' "${url}")"

            if [[ "${code}" != "200" ]]; then
              echo "::error title=Production HTTP failure::${url} returned HTTP ${code}"
              cat "${body}" || true
              exit 1
            fi

            if ! grep -Fq "${marker}" "${body}"; then
              echo "::error title=Production content contract failure::${url} is missing marker: ${marker}"
              exit 1
            fi

            if grep -Eqi 'Fatal error|Parse error|Uncaught (Error|Exception)|<b>Warning</b>|<b>Notice</b>' "${body}"; then
              echo "::error title=PHP/runtime leakage::${url} exposes a PHP/runtime error marker"
              exit 1
            fi

            if grep -Eqi 'seagreen|staging\.bitmomo|\.hostingersite\.|\.hostingerapp\.' "${body}"; then
              echo "::error title=Environment leakage::${url} exposes a staging/preview hostname"
              exit 1
            fi

            if has_robots_noindex "${body}"; then
              echo "::error title=Production indexing regression::${url} unexpectedly contains robots noindex"
              exit 1
            fi

            rm -f "${body}"
            echo "PASS ${url}"
          }

          check_page "https://bitmomo.id/" "BTC Intelligence"
          check_page "https://bitmomo.id/btc-intelligence/" "Pahami BTC dalam konteks."
          check_page "https://bitmomo.id/pro/" "FOUNDING MEMBERSHIP"

      - name: Verify BTC Intelligence provenance contract
        shell: bash
        run: |
          set -euo pipefail
          body="$(mktemp)"
          code="$(curl --location --silent --show-error --max-time 20 --output "${body}" --write-out '%{http_code}' 'https://bitmomo.id/btc-intelligence/')"
          test "${code}" = "200"
          grep -Fq 'SOURCE' "${body}"
          grep -Fq 'AS OF' "${body}"
          grep -Fq 'WIB' "${body}"
          rm -f "${body}"
          echo 'PASS provenance SOURCE / AS OF / WIB'

      - name: Verify canonical snapshot consistency across public surfaces
        if: github.event_name != 'pull_request'
        shell: bash
        run: |
          set -euo pipefail

          health="$(mktemp)"
          curl --location --silent --show-error --max-time 20 \
            'https://bitmomo.id/wp-admin/admin-ajax.php?action=bitmomo_health' > "${health}"

          deployed_version="$(python3 - "${health}" <<'PY'
          import json
          import sys
          try:
              payload = json.load(open(sys.argv[1], encoding='utf-8'))
              print(payload.get('version', '0'))
          except Exception:
              print('0')
          PY
          )"

          # The contract was introduced in theme v4.3. Do not create a false
          # alarm during the merge-to-deploy window while production is older.
          if [[ "$(printf '%s\n' '4.3' "${deployed_version}" | sort -V | head -n1)" != '4.3' ]]; then
            echo "SKIP snapshot consistency contract: production theme ${deployed_version} < 4.3"
            exit 0
          fi

          home="$(mktemp)"
          btc="$(mktemp)"
          live="$(mktemp)"
          nonce="$(date +%s)"

          curl --location --silent --show-error --max-time 20 "https://bitmomo.id/?bm_monitor=${nonce}" > "${home}"
          curl --location --silent --show-error --max-time 20 "https://bitmomo.id/btc-intelligence/?bm_monitor=${nonce}" > "${btc}"
          curl --location --silent --show-error --max-time 20 \
            "https://bitmomo.id/wp-admin/admin-ajax.php?action=bitmomo_snapshot_contract&_=${nonce}" > "${live}"

          python3 - "${home}" "${btc}" "${live}" <<'PY'
          import json
          import sys
          from html.parser import HTMLParser

          class ContractParser(HTMLParser):
              def __init__(self):
                  super().__init__(convert_charrefs=True)
                  self.contract = None

              def handle_starttag(self, tag, attrs):
                  if tag.lower() != 'meta':
                      return
                  data = dict(attrs)
                  if data.get('name') != 'bitmomo-snapshot-contract':
                      return
                  raw = data.get('content', '')
                  self.contract = json.loads(raw)

          def page_contract(path):
              parser = ContractParser()
              with open(path, encoding='utf-8', errors='ignore') as handle:
                  parser.feed(handle.read())
              if not isinstance(parser.contract, dict):
                  raise SystemExit(f'missing bitmomo-snapshot-contract meta in {path}')
              return parser.contract

          home = page_contract(sys.argv[1])
          btc = page_contract(sys.argv[2])
          with open(sys.argv[3], encoding='utf-8') as handle:
              live_payload = json.load(handle)
          live = live_payload.get('data') if live_payload.get('success') is True else None
          if not isinstance(live, dict):
              raise SystemExit('canonical snapshot endpoint returned an invalid payload')

          fields = (
              'schema', 'available', 'status', 'as_of', 'market_state',
              'directional_bias', 'direction_strength', 'confidence',
              'opportunity_status', 'opportunity_state',
          )

          def project(value):
              return {field: value.get(field) for field in fields}

          expected = project(live)
          comparisons = {'homepage': project(home), 'btc-intelligence': project(btc)}
          failures = []
          for label, observed in comparisons.items():
              if observed != expected:
                  failures.append((label, observed))

          if failures:
              print('Canonical live contract:', json.dumps(expected, sort_keys=True))
              for label, observed in failures:
                  print(f'{label} contract:      ', json.dumps(observed, sort_keys=True))
              raise SystemExit('public intelligence surfaces disagree with the canonical live adapter')

          print('PASS homepage == btc-intelligence == canonical live snapshot')
          PY

      - name: Diagnose public Binance USD-M reachability
        continue-on-error: true
        shell: bash
        run: |
          set +e
          code="$(curl --location --silent --show-error --connect-timeout 5 --max-time 10 --output /tmp/binance-ping --write-out '%{http_code}' 'https://fapi.binance.com/fapi/v1/ping')"
          rc=$?
          set -e

          if [[ "${rc}" -ne 0 ]]; then
            echo "::warning title=External Binance diagnostic::GitHub runner could not connect to Binance USD-M (curl ${rc}, HTTP ${code:-000}). Production Issue #90 remains independently tracked."
            exit 0
          fi

          if [[ "${code}" != "200" ]]; then
            echo "::warning title=External Binance diagnostic::Binance USD-M returned HTTP ${code} from the GitHub runner. Production Issue #90 remains independently tracked."
            exit 0
          fi

          echo "PASS external Binance USD-M endpoint reachable from GitHub runner"

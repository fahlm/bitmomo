name: Hyperliquid Research Selector

on:
  push:
    branches:
      - research/hyperliquid-referral-volume-v0
    paths:
      - 'research/hyperliquid-volume/**'
      - 'docs/research/hyperliquid-volume/**'
      - '.github/workflows/hyperliquid-research-selector.yml'
  pull_request:
    paths:
      - 'research/hyperliquid-volume/**'
      - 'docs/research/hyperliquid-volume/**'
      - '.github/workflows/hyperliquid-research-selector.yml'

permissions:
  contents: read

jobs:
  selector-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: research/hyperliquid-volume
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install test dependency
        run: python -m pip install --upgrade pip pytest

      - name: Compile selector package
        run: python -m compileall -q market_selector

      - name: Run complete selector research tests
        env:
          PYTHONPATH: .
        run: pytest -q tests

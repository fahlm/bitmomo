name: Homepage research boundary

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - 'website/wp-content/themes/bitmomo-child-v3/template-parts/research.php'
      - 'website/wp-content/themes/bitmomo-child-v3/inc/template-functions.php'
      - 'scripts/check-home-research-boundary.mjs'
      - '.github/workflows/home-research-boundary.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: home-research-boundary-${{ github.ref }}
  cancel-in-progress: true

jobs:
  research-boundary:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Check homepage research qualification boundary
        run: node scripts/check-home-research-boundary.mjs

name: UI browser safety

on:
  workflow_dispatch:
    inputs:
      base_url:
        description: Target URL (canonical staging by default; production may be entered explicitly)
        required: true
        default: "https://seagreen-snail-158456.hostingersite.com"
      expected_social_json:
        description: Optional JSON map of social channels that must render exactly; {} keeps fail-closed semantics
        required: false
        default: "{}"
  schedule:
    - cron: "17 18 * * 1"

permissions:
  contents: read

concurrency:
  group: ui-browser-safety-${{ github.ref }}-${{ github.event.inputs.base_url || 'production' }}
  cancel-in-progress: true

jobs:
  browser-contract:
    name: Responsive, accessibility, and article-reading contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve audit target
        id: version_gate
        shell: bash
        run: |
          set -euo pipefail
          echo "run_audit=true" >> "${GITHUB_OUTPUT}"
          echo "Browser audit enabled for ${{ github.event_name }}."

      - name: Verify staging HTML/CDN asset coherence
        if: steps.version_gate.outputs.run_audit == 'true' && github.event_name == 'workflow_dispatch' && contains(github.event.inputs.base_url, 'hostingersite.com')
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-staging-asset-coherence.py --base-url "${{ github.event.inputs.base_url }}"

      - name: Install browser audit dependencies
        if: steps.version_gate.outputs.run_audit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.63.0 @axe-core/playwright@4.13.0
          npx playwright install --with-deps chromium

      - name: Audit public UI across breakpoints
        if: steps.version_gate.outputs.run_audit == 'true'
        env:
          BITMOMO_UI_BASE_URL: ${{ github.event.inputs.base_url || 'https://bitmomo.id' }}
          BITMOMO_UI_OUTPUT_DIR: ui-artifacts
          BITMOMO_EXPECTED_SOCIAL_JSON: ${{ github.event.inputs.expected_social_json || '{}' }}
        run: node scripts/check-public-ui.mjs

      - name: Audit article search promise and body cleanliness
        if: steps.version_gate.outputs.run_audit == 'true'
        env:
          BITMOMO_UI_BASE_URL: ${{ github.event.inputs.base_url || 'https://bitmomo.id' }}
          BITMOMO_UI_OUTPUT_DIR: ui-artifacts
        run: node scripts/check-article-cleanliness.mjs

      - name: Upload screenshots and audit report
        if: always() && steps.version_gate.outputs.run_audit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bitmomo-ui-browser-audit-${{ github.run_id }}
          path: ui-artifacts/
          if-no-files-found: warn
          retention-days: 14

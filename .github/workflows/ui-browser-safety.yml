name: UI browser safety

on:
  push:
    branches: [main]
    paths:
      - "website/wp-content/themes/bitmomo-child-v3/**"
      - "website/wp-content/plugins/bitmomo-btc-intelligence/**"
      - "website/wp-content/plugins/bitmomo-pro/**"
      - "scripts/check-public-ui.mjs"
      - ".github/workflows/ui-browser-safety.yml"
  workflow_dispatch:
    inputs:
      base_url:
        description: Optional base URL (production by default; staging URL allowed)
        required: false
        default: "https://bitmomo.id"
  schedule:
    - cron: "17 18 * * *"

permissions:
  contents: read

concurrency:
  group: ui-browser-safety
  cancel-in-progress: true

jobs:
  browser-contract:
    name: Responsive and accessibility contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Resolve source/runtime parity
        id: version_gate
        shell: bash
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          echo "run_audit=true" >> "${GITHUB_OUTPUT}"

          # Scheduled runs monitor whatever is actually live. Manual runs may
          # intentionally target staging, so both always audit. Push runs must
          # first prove that production contains the exact public runtime bytes
          # represented by this checkout.
          if [[ "${EVENT_NAME}" != "push" ]]; then
            echo "Browser audit enabled for ${EVENT_NAME}."
            exit 0
          fi

          source_fingerprint="$(python3 - <<'PY'
          import hashlib
          import json
          from pathlib import Path

          root = Path('website/wp-content/themes/bitmomo-child-v3')
          contract = json.loads((root / 'data/runtime-fingerprint.json').read_text(encoding='utf-8'))
          files = sorted(set(str(item).lstrip('/').replace('\\\\', '/') for item in contract.get('files', []) if str(item).strip()))
          if not files:
              raise SystemExit('runtime fingerprint contract has no files')

          digest = hashlib.sha256()
          for relative in files:
              if '..' in Path(relative).parts:
                  raise SystemExit(f'unsafe fingerprint path: {relative}')
              path = root / relative
              if not path.is_file():
                  raise SystemExit(f'missing fingerprint source file: {relative}')
              file_hash = hashlib.sha256(path.read_bytes()).hexdigest()
              digest.update(relative.encode('utf-8'))
              digest.update(b'\0')
              digest.update(file_hash.encode('ascii'))
              digest.update(b'\0')
          print(digest.hexdigest())
          PY
          )"

          runtime_payload="$(mktemp)"
          code="$(curl --location --silent --show-error --max-time 20 \
            --output "${runtime_payload}" --write-out '%{http_code}' \
            'https://bitmomo.id/wp-admin/admin-ajax.php?action=bitmomo_runtime_fingerprint')"

          if [[ "${code}" != "200" ]]; then
            echo "run_audit=false" >> "${GITHUB_OUTPUT}"
            echo "SKIP push browser audit: production has not proven the runtime-fingerprint contract (HTTP ${code})."
            echo "Manual staging audits and scheduled production monitoring remain enabled."
            exit 0
          fi

          runtime_fingerprint="$(python3 - "${runtime_payload}" <<'PY'
          import json
          import sys
          try:
              payload = json.load(open(sys.argv[1], encoding='utf-8'))
              print(payload.get('data', {}).get('fingerprint', '') if payload.get('success') else '')
          except Exception:
              print('')
          PY
          )"

          if [[ -z "${runtime_fingerprint}" ]]; then
            echo "run_audit=false" >> "${GITHUB_OUTPUT}"
            echo "SKIP push browser audit: production returned no verifiable runtime fingerprint."
            exit 0
          fi

          echo "Source public-runtime fingerprint: ${source_fingerprint}"
          echo "Production public-runtime fingerprint: ${runtime_fingerprint}"

          if [[ "${source_fingerprint}" != "${runtime_fingerprint}" ]]; then
            echo "run_audit=false" >> "${GITHUB_OUTPUT}"
            echo "SKIP push browser audit: source bytes are not yet the bytes deployed to production."
            echo "Manual staging audits and scheduled production monitoring remain enabled."
          fi

      - name: Install browser audit dependencies
        if: steps.version_gate.outputs.run_audit == 'true'
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.63.0 @axe-core/playwright@4.13.0
          npx playwright install --with-deps chromium

      - name: Audit public UI across breakpoints
        if: steps.version_gate.outputs.run_audit == 'true'
        env:
          BITMOMO_UI_BASE_URL: ${{ github.event.inputs.base_url || 'https://bitmomo.id' }}
          BITMOMO_UI_OUTPUT_DIR: ui-artifacts
        run: node scripts/check-public-ui.mjs

      - name: Upload screenshots and audit report
        if: always() && steps.version_gate.outputs.run_audit == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: bitmomo-ui-browser-audit-${{ github.run_id }}
          path: ui-artifacts/
          if-no-files-found: warn
          retention-days: 14

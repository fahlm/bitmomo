name: UI browser safety [HOSTED RUNNERS LOCKED]

# Zero-cost mode: no weekly browser runner and no hosted browser install.
# Engineers validate source locally and run browser acceptance only on a deployed candidate.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-actions-locked:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Hosted GitHub Actions are locked. Browser acceptance belongs on the deployed candidate.'

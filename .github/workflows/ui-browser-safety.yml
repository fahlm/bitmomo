name: UI browser safety

on:
  # Browser acceptance is deliberately manual while Whitelist V1 is under
  # release hardening. Run it only against an exact deployed candidate rather
  # than paying for weekly browser/dependency installation on unchanged code.
  workflow_dispatch:
    inputs:
      base_url:
        description: Target URL (canonical staging by default; production may be entered explicitly)
        required: true
        default: "https://seagreen-snail-158456.hostingersite.com"
      expected_social_json:
        description: Optional JSON map of social channels that must render exactly; {} keeps fail-closed semantics
        required: false
        default: "{}"

permissions:
  contents: read

concurrency:
  group: ui-browser-safety-${{ github.ref }}-${{ github.event.inputs.base_url || 'production' }}
  cancel-in-progress: true

jobs:
  browser-contract:
    name: Responsive, accessibility, and article-reading contract
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify staging HTML/CDN asset coherence
        if: contains(github.event.inputs.base_url, 'hostingersite.com')
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/check-staging-asset-coherence.py --base-url "${{ github.event.inputs.base_url }}"

      - name: Install browser audit dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save --no-package-lock playwright@1.63.0 @axe-core/playwright@4.13.0
          npx playwright install --with-deps chromium

      - name: Audit public UI across breakpoints
        env:
          BITMOMO_UI_BASE_URL: ${{ github.event.inputs.base_url }}
          BITMOMO_UI_OUTPUT_DIR: ui-artifacts
          BITMOMO_EXPECTED_SOCIAL_JSON: ${{ github.event.inputs.expected_social_json || '{}' }}
        run: node scripts/check-public-ui.mjs

      - name: Audit live BTC intelligence freshness
        env:
          BITMOMO_UI_BASE_URL: ${{ github.event.inputs.base_url }}
        run: node scripts/check-intelligence-freshness.mjs

      - name: Audit homepage bottom and footer geometry
        env:
          BITMOMO_UI_BASE_URL: ${{ github.event.inputs.base_url }}
          BITMOMO_UI_OUTPUT_DIR: ui-artifacts
        run: node scripts/check-footer-home-geometry.mjs

      - name: Audit article search promise and body cleanliness
        env:
          BITMOMO_UI_BASE_URL: ${{ github.event.inputs.base_url }}
          BITMOMO_UI_OUTPUT_DIR: ui-artifacts
        run: node scripts/check-article-cleanliness.mjs

      - name: Audit Open Graph and X preview metadata
        env:
          BITMOMO_UI_BASE_URL: ${{ github.event.inputs.base_url }}
        run: node scripts/check-social-preview.mjs

      - name: Upload screenshots and audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bitmomo-ui-browser-audit-${{ github.run_id }}
          path: ui-artifacts/
          if-no-files-found: warn
          retention-days: 14

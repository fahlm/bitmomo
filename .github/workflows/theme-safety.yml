name: Theme safety checks [HOSTED RUNNERS LOCKED]

# Zero-cost mode. Normal engineering validation runs locally:
#   bash scripts/bitmomo-check.sh test
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-actions-locked:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Hosted GitHub Actions are locked. Run local UI/source checks instead.'

name: Theme safety checks

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - "website/wp-content/themes/bitmomo-child-v3/**"
      - "website/wp-content/plugins/bitmomo-pro/bitmomo-pro.php"
      - "website/wp-content/plugins/bitmomo-pro/includes/class-bitmomo-pro-account.php"
      - "website/wp-content/plugins/bitmomo-pro/assets/css/bitmomo-pro-account.css"
      - "website/wp-content/plugins/bitmomo-pro/assets/js/bitmomo-pro-whitelist.js"
      - "scripts/check-theme-source-contract.sh"
      - "scripts/check-ui-architecture.mjs"
      - "scripts/check-terminal-grade-contract.mjs"
      - "scripts/check-launch-audit-hardening.mjs"
      - "scripts/check-navigation-footer.mjs"
      - "scripts/check-public-ui.mjs"
      - "scripts/check-staged-cascade-ownership.mjs"
      - "scripts/check-public-readability-rhythm.mjs"
      - "scripts/audit-css-debt.mjs"
      - "docs/PUBLIC_SURFACE_CONTRACT.md"
      - ".github/workflows/theme-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-syntax:
    if: github.event_name != 'pull_request' || github.event.pull_request.draft == false
    name: PHP syntax, public-surface and UI architecture
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show PHP version
        run: php --version

      - name: Enforce canonical theme source contract
        run: bash scripts/check-theme-source-contract.sh

      - name: Lint changed public PHP
        shell: bash
        run: |
          set -euo pipefail
          theme_dir="website/wp-content/themes/bitmomo-child-v3"
          mapfile -d '' php_files < <(find "${theme_dir}" -type f -name '*.php' -print0)
          test "${#php_files[@]}" -gt 0
          for file in "${php_files[@]}"; do php -l "${file}"; done
          php -l website/wp-content/plugins/bitmomo-pro/bitmomo-pro.php
          php -l website/wp-content/plugins/bitmomo-pro/includes/class-bitmomo-pro-account.php

      - name: Syntax-check browser and contract sources
        shell: bash
        run: |
          set -euo pipefail
          bash -n scripts/check-theme-source-contract.sh
          node --check scripts/check-public-ui.mjs
          node --check scripts/check-terminal-grade-contract.mjs
          node --check scripts/check-launch-audit-hardening.mjs
          node --check scripts/check-staged-cascade-ownership.mjs
          node --check scripts/check-public-readability-rhythm.mjs
          node --check website/wp-content/plugins/bitmomo-pro/assets/js/bitmomo-pro-whitelist.js

      - name: Enforce UI architecture and WCAG source contracts
        run: node scripts/check-ui-architecture.mjs

      - name: Enforce terminal-grade public contract
        run: node scripts/check-terminal-grade-contract.mjs

      - name: Enforce launch audit hardening
        run: node scripts/check-launch-audit-hardening.mjs

      - name: Enforce navigation and footer contract
        run: node scripts/check-navigation-footer.mjs

      - name: Enforce staged legacy cascade ownership
        run: node scripts/check-staged-cascade-ownership.mjs

      - name: Enforce public readability and vertical rhythm
        run: node scripts/check-public-readability-rhythm.mjs

      - name: Report CSS debt baseline
        run: node scripts/audit-css-debt.mjs

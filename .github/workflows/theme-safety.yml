name: Theme safety checks

on:
  pull_request:
    paths:
      - "website/wp-content/themes/bitmomo-child-v3/**"
      - "config/production-runtime.json"
      - "scripts/check-ui-architecture.mjs"
      - "scripts/check-frontend-foundation.mjs"
      - "scripts/check-navigation-footer.mjs"
      - "scripts/audit-css-debt.mjs"
      - "docs/PUBLIC_SURFACE_CONTRACT.md"
      - ".github/workflows/theme-safety.yml"
  push:
    branches:
      - main
      - "chore/**"
      - "feature/**"
      - "fix/**"
      - "refactor/**"
    paths:
      - "website/wp-content/themes/bitmomo-child-v3/**"
      - "config/production-runtime.json"
      - "scripts/check-ui-architecture.mjs"
      - "scripts/check-frontend-foundation.mjs"
      - "scripts/check-navigation-footer.mjs"
      - "scripts/audit-css-debt.mjs"
      - "docs/PUBLIC_SURFACE_CONTRACT.md"
      - ".github/workflows/theme-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-syntax:
    name: PHP syntax, public-surface and UI architecture
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show PHP version
        run: php --version

      - name: Verify canonical frontend ownership
        shell: bash
        run: |
          set -euo pipefail
          theme_dir="website/wp-content/themes/bitmomo-child-v3"
          expected=(
            "functions.php"
            "front-page.php"
            "page.php"
            "single.php"
            "home.php"
            "archive.php"
            "category.php"
            "tag.php"
            "search.php"
            "404.php"
            "index.php"
            "header.php"
            "footer.php"
            "style.css"
            "assets/css/foundation.css"
            "assets/css/navigation-footer.css"
            "assets/css/public-surfaces.css"
            "assets/css/home.css"
            "assets/css/research.css"
            "assets/css/about.css"
            "template-parts/home-authority.php"
            "template-parts/research-hub.php"
            "template-parts/about-authority.php"
            "template-parts/archive-index.php"
          )
          for file in "${expected[@]}"; do
            test -f "${theme_dir}/${file}" || {
              echo "::error file=${theme_dir}/${file}::Required canonical frontend file is missing"
              exit 1
            }
          done
          test -f "docs/PUBLIC_SURFACE_CONTRACT.md" || {
            echo "::error file=docs/PUBLIC_SURFACE_CONTRACT.md::Public surface contract is missing"
            exit 1
          }

      - name: Prevent legacy UI regressions
        shell: bash
        run: |
          set -euo pipefail
          theme_dir="website/wp-content/themes/bitmomo-child-v3"

          if grep -q "Informasi AI &" "${theme_dir}/home.php"; then
            echo "::error file=${theme_dir}/home.php::Legacy media positioning returned"
            exit 1
          fi
          if grep -q "big-stories" "${theme_dir}/tag.php"; then
            echo "::error file=${theme_dir}/tag.php::Legacy Big Stories special-case returned"
            exit 1
          fi

          for file in home.php archive.php tag.php search.php index.php; do
            grep -q "template-parts/archive" "${theme_dir}/${file}" || {
              echo "::error file=${theme_dir}/${file}::Generic archive route must consume shared archive surface"
              exit 1
            }
          done
          grep -q "template-parts/research', 'hub" "${theme_dir}/category.php" || {
            echo "::error file=${theme_dir}/category.php::Riset category must own dedicated Research Hub"
            exit 1
          }
          grep -q "template-parts/archive" "${theme_dir}/category.php" || {
            echo "::error file=${theme_dir}/category.php::Non-Riset categories must retain shared archive fallback"
            exit 1
          }

          grep -q "template-parts/home', 'authority" "${theme_dir}/front-page.php" || {
            echo "::error file=${theme_dir}/front-page.php::Homepage lost research authority layer"
            exit 1
          }
          grep -q "template-parts/whitelist" "${theme_dir}/front-page.php" || {
            echo "::error file=${theme_dir}/front-page.php::Homepage lost canonical Pro conversion surface"
            exit 1
          }
          if grep -Eq "template-parts/(pro.*teaser|newsletter)" "${theme_dir}/front-page.php"; then
            echo "::error file=${theme_dir}/front-page.php::Duplicate conversion/retention surface returned"
            exit 1
          fi

          if grep -Eqi '<link[^>]+stylesheet' "${theme_dir}/header.php"; then
            echo "::error file=${theme_dir}/header.php::Stylesheets must be dependency-managed, not manually injected"
            exit 1
          fi
          grep -q "foundation.css" "${theme_dir}/inc/trait-bitmomo-assets.php" || exit 1
          grep -q "navigation-footer.css" "${theme_dir}/inc/trait-bitmomo-assets.php" || exit 1
          grep -q "public-surfaces.css" "${theme_dir}/inc/trait-bitmomo-assets.php" || exit 1

          test ! -f "${theme_dir}/template-parts/newsletter.php" || {
            echo "::error file=${theme_dir}/template-parts/newsletter.php::Standalone newsletter template must stay removed"
            exit 1
          }
          test ! -f "${theme_dir}/template-parts/pro-teaser.php" || {
            echo "::error file=${theme_dir}/template-parts/pro-teaser.php::Obsolete Pro teaser relic must not exist"
            exit 1
          }
          test ! -f "${theme_dir}/template-parts/why-bitmomo.php" || {
            echo "::error file=${theme_dir}/template-parts/why-bitmomo.php::Obsolete Why Bitmomo relic must not exist"
            exit 1
          }

      - name: Lint theme PHP
        shell: bash
        run: |
          set -euo pipefail
          theme_dir="website/wp-content/themes/bitmomo-child-v3"
          mapfile -d '' php_files < <(find "${theme_dir}" -type f -name '*.php' -print0)
          test "${#php_files[@]}" -gt 0
          for file in "${php_files[@]}"; do php -l "${file}"; done

      - name: Enforce frontend foundation ownership
        run: node scripts/check-frontend-foundation.mjs

      - name: Enforce UI architecture and WCAG source contracts
        run: node scripts/check-ui-architecture.mjs

      - name: Enforce navigation and footer contract
        run: node scripts/check-navigation-footer.mjs

      - name: Report CSS debt baseline
        run: node scripts/audit-css-debt.mjs

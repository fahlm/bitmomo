name: Theme safety checks

on:
  pull_request:
    paths:
      - "website/wp-content/themes/bitmomo-child-v3/**"
      - "scripts/check-ui-architecture.mjs"
      - "scripts/check-navigation-footer.mjs"
      - "scripts/audit-css-debt.mjs"
      - "docs/PUBLIC_SURFACE_CONTRACT.md"
      - ".github/workflows/theme-safety.yml"
  push:
    branches:
      - main
      - "chore/**"
      - "feature/**"
      - "fix/**"
    paths:
      - "website/wp-content/themes/bitmomo-child-v3/**"
      - "scripts/check-ui-architecture.mjs"
      - "scripts/check-navigation-footer.mjs"
      - "scripts/audit-css-debt.mjs"
      - "docs/PUBLIC_SURFACE_CONTRACT.md"
      - ".github/workflows/theme-safety.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: theme-safety-${{ github.ref }}
  cancel-in-progress: true

jobs:
  php-syntax:
    name: PHP syntax, public-surface and UI architecture
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Show PHP version
        run: php --version

      - name: Verify public template ownership
        shell: bash
        run: |
          set -euo pipefail

          theme_dir="website/wp-content/themes/bitmomo-child-v3"
          expected=(
            "functions.php"
            "custom.css"
            "front-page.php"
            "page.php"
            "single.php"
            "home.php"
            "archive.php"
            "category.php"
            "tag.php"
            "search.php"
            "404.php"
            "index.php"
            "header.php"
            "footer.php"
            "style.css"
            "assets/css/home-opportunity.css"
            "assets/css/public-surfaces.css"
            "assets/css/navigation-footer.css"
            "assets/css/public-readability.css"
            "assets/css/research.css"
            "assets/css/about.css"
            "template-parts/archive-index.php"
            "template-parts/research-hub.php"
            "template-parts/about-authority.php"
          )

          for file in "${expected[@]}"; do
            test -f "${theme_dir}/${file}" || {
              echo "::error file=${theme_dir}/${file}::Required public-surface file is missing"
              exit 1
            }
          done

          test -f "docs/PUBLIC_SURFACE_CONTRACT.md" || {
            echo "::error file=docs/PUBLIC_SURFACE_CONTRACT.md::Public surface contract is missing"
            exit 1
          }

      - name: Prevent legacy UI regressions
        shell: bash
        run: |
          set -euo pipefail
          theme_dir="website/wp-content/themes/bitmomo-child-v3"
          asset_trait="${theme_dir}/inc/trait-bitmomo-assets.php"

          if grep -q "Informasi AI &" "${theme_dir}/home.php"; then
            echo "::error file=${theme_dir}/home.php::Legacy media positioning returned to the posts index"
            exit 1
          fi

          if grep -q "big-stories" "${theme_dir}/tag.php"; then
            echo "::error file=${theme_dir}/tag.php::Legacy Big Stories special-case returned"
            exit 1
          fi

          for file in home.php archive.php category.php tag.php search.php index.php; do
            grep -q "template-parts/archive" "${theme_dir}/${file}" || {
              echo "::error file=${theme_dir}/${file}::Archive route must consume the shared archive surface"
              exit 1
            }
          done

          grep -q "template-parts/research" "${theme_dir}/category.php" || {
            echo "::error file=${theme_dir}/category.php::Riset must route to the canonical Research Hub"
            exit 1
          }

          grep -q "template-parts/about" "${theme_dir}/page.php" || {
            echo "::error file=${theme_dir}/page.php::About must use code-owned authority content"
            exit 1
          }

          grep -Eqi "research .* intelligence platform" "${theme_dir}/template-parts/about-authority.php" || {
            echo "::error file=${theme_dir}/template-parts/about-authority.php::About lost research/intelligence positioning"
            exit 1
          }

          if grep -Eqi "media independen|media independent" "${theme_dir}/template-parts/about-authority.php"; then
            echo "::error file=${theme_dir}/template-parts/about-authority.php::Publisher-first positioning must not return"
            exit 1
          fi

          grep -q "tag__not_in" "${theme_dir}/template-parts/research-hub.php" || {
            echo "::error file=${theme_dir}/template-parts/research-hub.php::Market Research must exclude AI Lab-tagged posts"
            exit 1
          }

          if grep -q "while ( have_posts()" "${theme_dir}/template-parts/research-hub.php"; then
            echo "::error file=${theme_dir}/template-parts/research-hub.php::Do not promote the unclassified legacy Riset loop as institutional research"
            exit 1
          fi

          grep -q "template-parts/whitelist" "${theme_dir}/front-page.php" || {
            echo "::error file=${theme_dir}/front-page.php::Homepage must keep one canonical Pro conversion surface"
            exit 1
          }

          if grep -q "template-parts/pro.*teaser" "${theme_dir}/front-page.php"; then
            echo "::error file=${theme_dir}/front-page.php::Do not restore separate Pro teaser + whitelist duplication"
            exit 1
          fi

          if grep -q "bm-howworks-future" "${theme_dir}/template-parts/how-it-works.php"; then
            echo "::error file=${theme_dir}/template-parts/how-it-works.php::Do not restore duplicated future-capability panel"
            exit 1
          fi

          if grep -q "public-surfaces.css" "${theme_dir}/header.php"; then
            echo "::error file=${theme_dir}/header.php::Public stylesheets must be enqueued, not hard-coded after wp_head"
            exit 1
          fi

          grep -q "public-surfaces.css" "${asset_trait}" || {
            echo "::error file=${asset_trait}::Canonical public-surface stylesheet is not enqueued"
            exit 1
          }

          grep -q "navigation-footer.css" "${asset_trait}" || {
            echo "::error file=${asset_trait}::Navigation/footer stylesheet is not enqueued"
            exit 1
          }

          grep -q "home-conversion.css" "${asset_trait}" || {
            echo "::error file=${asset_trait}::Homepage conversion stylesheet must remain enqueued after shared public styles"
            exit 1
          }

          grep -q "research.css" "${asset_trait}" || {
            echo "::error file=${asset_trait}::Research Hub stylesheet is not route-enqueued"
            exit 1
          }

          grep -q "about.css" "${asset_trait}" || {
            echo "::error file=${asset_trait}::About authority stylesheet is not route-enqueued"
            exit 1
          }

          test ! -f "${theme_dir}/template-parts/pro-teaser.php" || {
            echo "::error file=${theme_dir}/template-parts/pro-teaser.php::Obsolete standalone Pro teaser relic must not exist"
            exit 1
          }

          test ! -f "${theme_dir}/template-parts/why-bitmomo.php" || {
            echo "::error file=${theme_dir}/template-parts/why-bitmomo.php::Obsolete Why Bitmomo relic must not exist"
            exit 1
          }

      - name: Lint theme PHP
        shell: bash
        run: |
          set -euo pipefail

          theme_dir="website/wp-content/themes/bitmomo-child-v3"
          mapfile -d '' php_files < <(find "${theme_dir}" -type f -name '*.php' -print0)

          if [ "${#php_files[@]}" -eq 0 ]; then
            echo "::error::No PHP files found in ${theme_dir}"
            exit 1
          fi

          for file in "${php_files[@]}"; do
            php -l "${file}"
          done

      - name: Enforce UI architecture and WCAG source contracts
        run: node scripts/check-ui-architecture.mjs

      - name: Enforce navigation and footer contract
        run: node scripts/check-navigation-footer.mjs

      - name: Report CSS debt baseline
        run: node scripts/audit-css-debt.mjs

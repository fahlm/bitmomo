name: Full release safety

on:
  # Full Release is an explicit frozen-candidate gate. Normal PRs use scoped
  # feedback workflows; ordinary main merges must not build release artifacts.
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact frozen release-candidate commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: full-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Runtime, authoritative contracts, and artifact
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify explicit frozen candidate identity
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_CANDIDATE_SHA}" ]]; then
            echo "::error title=Candidate SHA mismatch::Selected ref resolved to ${actual_sha}, expected ${EXPECTED_CANDIDATE_SHA}."
            exit 1
          fi
          case "${GITHUB_REF}" in
            refs/heads/release/*|refs/heads/main)
              ;;
            *)
              echo "::error title=Invalid release ref::Full Release Safety may only run manually from release/* or main; got ${GITHUB_REF}."
              exit 1
              ;;
          esac
          echo "PASS explicit candidate ${actual_sha} on ${GITHUB_REF}"

      - name: Enforce CI governance before expensive release work
        run: node scripts/check-ci-governance.mjs

      - name: Lint every managed PHP file
        shell: bash
        run: |
          set -euo pipefail
          roots=(
            website/wp-content/themes/bitmomo-child-v3
            website/wp-content/plugins/bitmomo-ai
            website/wp-content/plugins/bitmomo-btc-intelligence
            website/wp-content/plugins/bitmomo-pro
            website/wp-content/plugins/bitmomo-regime
          )
          find "${roots[@]}" -type f -name '*.php' -print0 | sort -z | xargs -0 -n1 php -l

      - name: Run every supported deterministic PHP suite
        shell: bash
        run: |
          set -euo pipefail
          for plugin in bitmomo-ai bitmomo-btc-intelligence bitmomo-pro bitmomo-regime; do
            plugin_dir="website/wp-content/plugins/${plugin}"
            while IFS= read -r test; do
              echo "::group::${test}"
              (cd "${plugin_dir}" && php "${test#${plugin_dir}/}")
              echo "::endgroup::"
            done < <(find "${plugin_dir}/tests" -maxdepth 1 -type f -name 'test-*.php' | sort)
          done

      - name: Syntax-check first-party runtime and release tooling
        shell: bash
        run: |
          set -euo pipefail
          find website/wp-content/themes/bitmomo-child-v3 website/wp-content/plugins/bitmomo-ai website/wp-content/plugins/bitmomo-btc-intelligence website/wp-content/plugins/bitmomo-pro website/wp-content/plugins/bitmomo-regime \
            -type f -name '*.js' ! -path '*/tests/*' -print0 | sort -z | xargs -0 -n1 node --check

          for script in \
            scripts/check-ci-governance.mjs \
            scripts/check-m2-launch-surfaces.mjs \
            scripts/check-navigation-footer.mjs \
            scripts/check-ui-architecture.mjs \
            scripts/check-terminal-grade-contract.mjs \
            scripts/check-staged-cascade-ownership.mjs \
            scripts/check-public-readability-rhythm.mjs \
            scripts/check-institutional-copy.mjs \
            scripts/check-home-research-boundary.mjs \
            scripts/check-public-design-consistency.mjs \
            scripts/check-social-preview.mjs \
            scripts/audit-css-debt.mjs; do
            node --check "$script"
          done

          python3 - <<'PY'
          from pathlib import Path
          for name in (
              'scripts/build-production-artifact.py',
              'scripts/check-staging-artifact.py',
              'scripts/check-staging-asset-coherence.py',
          ):
              source = Path(name).read_text(encoding='utf-8')
              compile(source, name, 'exec')
              print(f'PASS python syntax {name}')
          PY

          bash -n \
            scripts/check-theme-source-contract.sh \
            scripts/check-authority-source-contract.sh \
            scripts/check-staging-safety.sh \
            scripts/check-staging-readiness.sh

      - name: Check M2 launch contract
        run: node scripts/check-m2-launch-surfaces.mjs

      - name: Check canonical theme source contract
        run: bash scripts/check-theme-source-contract.sh

      - name: Check canonical authority source contract
        run: bash scripts/check-authority-source-contract.sh

      - name: Check navigation and footer contract
        run: node scripts/check-navigation-footer.mjs

      - name: Check staged legacy cascade ownership
        run: node scripts/check-staged-cascade-ownership.mjs

      - name: Check public readability and vertical rhythm
        run: node scripts/check-public-readability-rhythm.mjs

      - name: Check UI architecture and WCAG source contract
        run: node scripts/check-ui-architecture.mjs

      - name: Check terminal-grade public contract
        run: node scripts/check-terminal-grade-contract.mjs

      - name: Check institutional copy contract
        run: node scripts/check-institutional-copy.mjs

      - name: Check homepage research qualification boundary
        run: node scripts/check-home-research-boundary.mjs

      - name: Check sitewide institutional design consistency
        run: node scripts/check-public-design-consistency.mjs

      - name: Check CSS debt baseline
        run: node scripts/audit-css-debt.mjs

      - name: Build deterministic production artifact twice
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/build-production-artifact.py --output-dir dist/first
          python3 scripts/build-production-artifact.py --output-dir dist/second
          cmp dist/first/bitmomo-runtime.tar dist/second/bitmomo-runtime.tar
          expected_count="$(python3 -c 'import json; print(json.load(open("config/production-runtime.json"))["expected_file_count"])')"
          actual_count="$(tar -tf dist/first/bitmomo-runtime.tar | wc -l | tr -d ' ')"
          test "${actual_count}" -eq "${expected_count}"
          ! tar -tf dist/first/bitmomo-runtime.tar | grep -Eq '(^|/)tests/|\.md$|\.env($|\.)|\.(key|pem|tmp|temp)$'

      - name: Verify exact candidate provenance in artifact manifests
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          import os
          import subprocess

          expected_commit = os.environ['GITHUB_SHA']
          expected_tree = subprocess.check_output(['git', 'rev-parse', 'HEAD^{tree}'], text=True).strip()
          manifests = []
          for path in ('dist/first/bitmomo-runtime-manifest.json', 'dist/second/bitmomo-runtime-manifest.json'):
              with open(path, encoding='utf-8') as handle:
                  value = json.load(handle)
              assert value.get('source_commit') == expected_commit, (path, value.get('source_commit'), expected_commit)
              assert value.get('source_tree') == expected_tree, (path, value.get('source_tree'), expected_tree)
              manifests.append(value)

          first, second = manifests
          assert first['artifact_sha256'] == second['artifact_sha256']
          assert first['file_count'] == second['file_count']
          assert first['files'] == second['files']
          assert first['packaging_definition_sha256'] == second['packaging_definition_sha256']
          print(f"PASS exact candidate provenance commit={expected_commit} tree={expected_tree}")
          print(f"PASS deterministic artifact sha256={first['artifact_sha256']}")
          PY

      - name: Upload reviewed runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitmomo-runtime-${{ github.sha }}
          path: |
            dist/first/bitmomo-runtime.tar
            dist/first/bitmomo-runtime-manifest.json
          if-no-files-found: error
          retention-days: 14

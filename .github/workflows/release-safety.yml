name: Full release safety

on:
  workflow_dispatch:
    inputs:
      candidate_sha:
        description: Exact frozen release-candidate commit SHA to validate
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: full-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  release:
    name: Runtime, authoritative contracts, and artifact
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Verify explicit frozen candidate identity
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: |
          set -euo pipefail
          actual_sha="$(git rev-parse HEAD)"
          if [[ "${actual_sha}" != "${EXPECTED_CANDIDATE_SHA}" ]]; then
            echo "::error title=Candidate SHA mismatch::Selected ref resolved to ${actual_sha}, expected ${EXPECTED_CANDIDATE_SHA}."
            exit 1
          fi
          case "${GITHUB_REF}" in
            refs/heads/release/*|refs/heads/rc-*|refs/heads/main)
              ;;
            *)
              echo "::error title=Invalid release ref::Full Release Safety may only run manually from release/*, rc-* or main; got ${GITHUB_REF}."
              exit 1
              ;;
          esac
          echo "PASS explicit candidate ${actual_sha} on ${GITHUB_REF}"

      - name: Run canonical exact-SHA release preflight
        shell: bash
        env:
          EXPECTED_CANDIDATE_SHA: ${{ inputs.candidate_sha }}
        run: bash scripts/run-release-preflight.sh --candidate-sha "${EXPECTED_CANDIDATE_SHA}" --output-dir dist

      - name: Upload reviewed runtime artifact
        uses: actions/upload-artifact@v4
        with:
          name: bitmomo-runtime-${{ github.sha }}
          path: |
            dist/first/bitmomo-runtime.tar
            dist/first/bitmomo-runtime-manifest.json
          if-no-files-found: error
          retention-days: 14

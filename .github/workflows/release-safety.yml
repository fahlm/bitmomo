name: Full release safety [HOSTED RUNNERS LOCKED]

# Zero-cost mode. Release validation is local/exact-SHA:
#   bash scripts/bitmomo-check.sh full <exact-40-char-sha>
# Do not rebuild an already accepted release candidate merely to obtain a hosted run.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  hosted-actions-locked:
    if: ${{ false }}
    runs-on: ubuntu-latest
    steps:
      - run: echo 'Hosted GitHub Actions are locked. Use the exact-SHA local release command.'
